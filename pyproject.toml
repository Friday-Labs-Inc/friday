[project]
name = "friday"
authors = [{ name = "Friday Labs", email = "hello@fridaylabs.in" }]
description = "Friday — a governed agent kernel for Frappe. Agents act as themselves, under their own roles, with every decision audited."
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # Sandboxed skill execution. Imported lazily; declared so a deploy that
    # intends to use the sandbox fails at install, not at first agent turn.
    "docker>=7.1.0",
    # llm/provider.py: the OpenAI-compatible client (MiniMax, OpenAI, …) and the
    # httpx timeout/exception types it wires. Neither was declared; the dev bench
    # only had openai because raven pulls it in, and httpx not at all — CI on a
    # stock bench surfaced 18 ModuleNotFoundError cases.
    "openai>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Local sentence-transformers embeddings for semantic memory recall. Optional:
# without it recall falls back to keyword + recency (no regression).
embeddings = ["sentence-transformers>=3.0.0"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"
